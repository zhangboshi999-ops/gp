# ==========================================================
# 移动端 H5 生产部署 —— 宝塔 Nginx 配置片段
# 场景：web/dist 静态文件 + /api 反代 PHP 后端 + /ws 反代 WebSocket
# 位置：宝塔 → 网站 → H5 站点 → 配置文件（放到 server { } 内）
# ==========================================================

# 若 H5 与后端同一站点，把下面的 upstream 改成 127.0.0.1:80 即可

upstream stock_api   { server 127.0.0.1:8080; }   # ← 改成后端 PHP 站点的实际端口（同域可删）
upstream stock_ws    { server 127.0.0.1:9502; }   # WebSocket 服务（socket/server.js）

server {
    listen 80;
    server_name h5.example.com;                    # ← 改成你的 H5 域名
    root /www/wwwroot/stock-h5;                    # ← 改成 dist 所在目录
    index index.html;

    # 前端路由 history 模式兜底（本项目为 hash/history 均可留着）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 接口反代
    location /api/ {
        proxy_pass http://stock_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # 上传的图片 / 后台附件同样走后端
    location /uploads/ {
        proxy_pass http://stock_api/uploads/;
        proxy_set_header Host $host;
    }

    # WebSocket 实时行情（Upgrade 头必须写，否则连不上）
    location /ws {
        proxy_pass http://stock_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;      # 长连接不主动断开
        proxy_send_timeout 3600s;
    }

    access_log /www/wwwlogs/stock-h5.access.log;
    error_log  /www/wwwlogs/stock-h5.error.log;
}
