# ==========================================================
# ThinkPHP 5 / FastAdmin —— 宝塔 Nginx 伪静态
# 位置：宝塔 → 网站 → 对应站点 → 伪静态 粘贴以下内容
# ==========================================================
location / {
    if (!-e $request_filename) {
        rewrite  ^(.*)$  /index.php?s=/$1  last;
        break;
    }
}

# 后台入口（随机名.php）兼容，无需额外规则；若访问后台 404，改用下面这段
# location / {
#     try_files $uri $uri/ /index.php?$query_string;
# }
