; ==========================================================
; 宝塔「进程守护管理器」命令行版 —— Supervisor 配置
; 界面操作见：docs/宝塔运行文档.md  第 7 节 方式三
;
; 用法：
;   1) 先用 which node / ls /www/server/php 确认下面两个路径，逐项改成实际值
;   2) cp bt-supervisor.conf /etc/supervisor/conf.d/stock.conf
;   3) supervisorctl update && supervisorctl status
;   4) 改了 fastadmin/application/extra/*.php 后记得：supervisorctl restart stock:*
; ==========================================================

[program:stock-socket]
directory=/www/wwwroot/stock/socket
; 注意： command 不经过 shell，不能写 "A=1 node"；需要环境变量就用 /usr/bin/env 前缀
command=/usr/bin/env WS_PORT=9502 REDIS_URL=redis://127.0.0.1:6379 /www/server/nodejs/v18/bin/node server.js
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
user=www
redirect_stderr=true
stdout_logfile=/www/wwwroot/stock/runtime/socket.log
; Redis 有密码时改成：redis://:你的密码@127.0.0.1:6379

[program:stock-tick]
directory=/www/wwwroot/stock/fastadmin
command=/www/server/php/81/bin/php think quote:tick
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
user=www
redirect_stderr=true
stdout_logfile=/www/wwwroot/stock/runtime/tick.log

[group:stock]
programs=stock-socket,stock-tick
