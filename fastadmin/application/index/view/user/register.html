<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card border-0 shadow" style="border-radius: 18px;">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center fw-bold mb-1" style="color: #000082;">Ro'yxatdan o'tish</h2>
                    <p class="text-center text-muted mb-4">Hisob yarating, bir necha daqiqada ariza topshiring</p>
                    <form name="form1" id="register-form" method="POST" action="">
                        <input type="hidden" name="invite_user_id" value="0"/>
                        <input type="hidden" name="url" value="{$url|htmlentities}"/>
                        {:token()}
                        <div class="form-group mb-3">
                            <label class="control-label form-label" for="username">Foydalanuvchi nomi</label>
                            <input type="text" id="username" name="username" data-rule="required;username;remote({:url('api/validate/check_username_available')}, id=0)" class="form-control" placeholder="Foydalanuvchi nomi 3-30 belgi" autocomplete="off">
                            <span class="msg-box"></span>
                        </div>
                        <div class="form-group mb-3">
                            <label class="control-label form-label" for="password">Parol</label>
                            <input type="password" id="password" name="password" data-rule="required;password" class="form-control" placeholder="Parol 6-30 belgi" autocomplete="off">
                            <span class="msg-box"></span>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Ro'yxatdan o'tish</button>
                        <a href="{:url('user/login')}?url={$url|urlencode|htmlentities}" class="btn btn-outline-primary w-100 py-2">Hisobingiz bormi? Kirish</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-group .form-label { font-weight: 600; color: #0b1c33; }
    .msg-box { display: block; color: #dc3545; font-size: 13px; min-height: 18px; margin-top: 4px; }
    .form-group.has-error .form-control { border-color: #dc3545; }
    .form-group.has-success .form-control { border-color: #198754; }
</style>
