<form id="reject-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">{:__('Member')}:</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">{$row.user.nickname|htmlentities} (ID: {$row.user_id})</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">{:__('Amount')}:</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">{$row.amount|htmlentities}</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">{:__('Checkremark')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-checkremark" data-rule="required" class="form-control" name="row[checkremark]" rows="4" placeholder="{:__('Please enter the reason for rejection')}"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-3"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-danger btn-embossed disabled">{:__('Reject')}</button>
        </div>
    </div>
</form>
