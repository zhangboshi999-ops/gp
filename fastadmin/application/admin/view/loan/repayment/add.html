<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Apply_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-apply_id" data-rule="required" data-source="loan/apply/index" data-field="name" data-primary-key="id" data-order-by="id_desc" data-and-or="OR" data-search-field="name,mobile" data-format-item="{name} #{id} · {mobile} · {status_text}" class="form-control selectpage" name="row[apply_id]" type="text" value="">
            <span class="help-block">会员身份按所选申请自动带入</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Period_no')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-period_no" data-rule="required" class="form-control" name="row[period_no]" type="text" value="1">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Amount')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" data-rule="required" class="form-control" step="0.01" min="0.01" name="row[amount]" type="number" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Due_time')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-due_time" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="false" name="row[due_time]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Payee_bank_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-payee_bank_name" class="form-control" name="row[payee_bank_name]" type="text" value="{$payee.bank_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Payee_branch_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-payee_branch_name" class="form-control" name="row[payee_branch_name]" type="text" value="{$payee.branch_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Payee_account_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-payee_account_type" class="form-control" name="row[payee_account_type]" type="text" value="{$payee.account_type|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Payee_account_no')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-payee_account_no" class="form-control" name="row[payee_account_no]" type="text" value="{$payee.account_no|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Payee_account_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-payee_account_name" class="form-control" name="row[payee_account_name]" type="text" value="{$payee.account_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Remark')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-remark" class="form-control" name="row[remark]" rows="3"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
