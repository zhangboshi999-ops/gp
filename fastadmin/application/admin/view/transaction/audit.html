<form id="audit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Sn')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="form-control-static">{$row.sn}</div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Type')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="form-control-static">{$row.type_text} / {$row.method} / {$row.currency}</div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Amount')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="form-control-static">{$row.amount}</div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Account_no')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="form-control-static">{$row.account_no|default='-'} {$row.account_name|default=''} {$row.address|default=''}</div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label for="status-success"><input id="status-success" name="row[status]" type="radio" value="success" checked> 审核通过</label>
                <label for="status-rejected"><input id="status-rejected" name="row[status]" type="radio" value="rejected"> 驳回申请</label>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Checkremark')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-checkremark" name="row[checkremark]" class="form-control" rows="3" placeholder="审核备注"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
